openapi: 3.1.0
info:
  title: SnapGen Video Middleware
  version: 3.0.0
  description: JSON API for direct SnapGen workflows and stateless long-video project orchestration without exposing credentials.
servers:
  - url: https://snapgen-middleware.onrender.com
    description: Production deployment on Render.
paths:
  /health:
    get:
      operationId: healthCheck
      summary: Check middleware health
      description: Use only to verify that the middleware is online.
      security: []
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    const: ok
  /privacy:
    get:
      operationId: getPrivacyPolicy
      summary: Get the public privacy policy
      description: Returns the middleware privacy policy as an HTML document.
      security: []
      responses:
        '200':
          description: Privacy policy HTML
          content:
            text/html:
              schema:
                type: string
  /video/generate:
    post:
      operationId: generateVideo
      summary: Start a SnapGen video generation
      description: Use when the user asks to create a video. Returns a UUID used to check asynchronous generation status.
      security:
        - MiddlewareApiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenerateVideoRequest'
            example:
              prompt: A cinematic red sports car driving along a coastal road at sunset
              model: veo-3.1-fast
              duration: 8
              resolution: 720p
              aspect_ratio: '16:9'
      responses:
        '200':
          description: SnapGen generation accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VideoGeneration'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          $ref: '#/components/responses/SnapGenError'
  /video/models:
    get:
      operationId: getVideoModels
      summary: List supported video models and capabilities
      description: Use before generation when model capabilities or compatible parameters are unknown.
      security:
        - MiddlewareApiKey: []
      responses:
        '200':
          description: Safe model capability registry
          content:
            application/json:
              schema:
                type: object
                required: [models]
                properties:
                  models:
                    type: array
                    items:
                      $ref: '#/components/schemas/VideoModel'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /video/extend:
    post:
      operationId: extendVideo
      summary: Extend an existing generated video
      description: Use only when the selected model reports supportsExtend=true. The source must be an existing SnapGen generation UUID.
      security:
        - MiddlewareApiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExtendVideoRequest'
      responses:
        '200':
          description: Extension accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VideoOperation'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          $ref: '#/components/responses/SnapGenError'
  /video/storyboard:
    post:
      operationId: createVideoStoryboard
      summary: Create a multi-scene Grok storyboard video
      description: Creates 2-10 chained Grok scenes. Each scene is 6 or 10 seconds and total duration cannot exceed 45 seconds.
      security:
        - MiddlewareApiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StoryboardRequest'
      responses:
        '200':
          description: Storyboard accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VideoOperation'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          $ref: '#/components/responses/SnapGenError'
  /video/projects/start:
    post:
      operationId: startVideoProjectV3
      summary: Validate and start a stateless long-video project
      description: Creates a signed Project State Token without calling SnapGen. The client must preserve and replace this token after every response.
      security:
        - MiddlewareApiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartProjectRequest'
            example:
              concept: Uma aventura infantil na floresta
              model: veo-3.1-fast
              duration: 70
              resolution: 1080p
              aspect_ratio: '16:9'
              visualBible:
                style: 2D animated children's adventure
                characters:
                  - id: lia
                    description: Young explorer with a yellow backpack
                environment: Warm enchanted forest at golden hour
                continuityRules:
                  - Keep Lia, her backpack, lighting, and travel direction consistent
              scenes:
                - { sequence: 1, prompt: Lia enters the enchanted forest, continuityInstructions: Preserve Lia and the golden-hour lighting }
                - { sequence: 2, prompt: Lia follows a glowing trail, continuityInstructions: Continue forward along the same path }
                - { sequence: 3, prompt: Lia meets a friendly fox, continuityInstructions: Preserve Lia and the established forest }
                - { sequence: 4, prompt: Lia and the fox cross a stream, continuityInstructions: Keep character designs and direction consistent }
                - { sequence: 5, prompt: They discover ancient trees, continuityInstructions: Maintain the same lighting and visual style }
                - { sequence: 6, prompt: Fireflies guide them uphill, continuityInstructions: Continue the established journey }
                - { sequence: 7, prompt: They reach a hidden clearing, continuityInstructions: Preserve characters and environment palette }
                - { sequence: 8, prompt: Lia finds a glowing seed, continuityInstructions: Maintain props and camera direction }
                - { sequence: 9, prompt: Lia plants the seed as the forest shines, continuityInstructions: Conclude with the established characters and style }
      responses:
        '202':
          description: Stateless project initialized; no paid generation has started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '413':
          description: Project State Token would exceed the configured limit
  /video/projects/continue:
    post:
      operationId: continueVideoProjectV3
      summary: Advance a stateless long-video project by one safe step
      description: Verifies the token and performs at most one paid SnapGen POST or one status GET. Never retries a paid POST.
      security:
        - MiddlewareApiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectStateRequest'
      responses:
        '200':
          description: Updated signed project state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /video/projects/render:
    post:
      operationId: renderVideoProjectV3
      summary: Assemble completed project scenes into a temporary MP4
      description: Refreshes completed media URLs by UUID, downloads them securely, normalizes and concatenates with FFmpeg, and stores the result only on ephemeral local storage.
      security:
        - MiddlewareApiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectStateRequest'
      responses:
        '200':
          description: Render completed with a temporary download URL
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '409':
          description: Project is not ready or source media is unavailable
        '401':
          $ref: '#/components/responses/Unauthorized'
  /video/projects/output/{projectId}:
    get:
      operationId: downloadVideoProjectOutputV3
      summary: Download an ephemeral rendered MP4
      description: The access token is short-lived. The file can disappear after expiry, cleanup, restart, or deploy because no persistent storage is used.
      security:
        - MiddlewareApiKey: []
      parameters:
        - name: projectId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: access
          in: query
          required: true
          schema: { type: string }
      responses:
        '200':
          description: MP4 video stream
          content:
            video/mp4:
              schema: { type: string, format: binary }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '410':
          description: Ephemeral output expired or was lost
  /video/{uuid}:
    get:
      operationId: getVideoGenerationStatus
      summary: Get a SnapGen generation by UUID
      description: Use after generateVideo to check whether a generation is processing, completed, or failed. Never invent a video URL.
      security:
        - MiddlewareApiKey: []
      parameters:
        - name: uuid
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Normalized video generation status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VideoGenerationStatus'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          $ref: '#/components/responses/SnapGenError'
components:
  securitySchemes:
    MiddlewareApiKey:
      type: apiKey
      in: header
      name: x-api-key
  schemas:
    VisualBible:
      type: object
      additionalProperties: false
      required: [style, characters, environment, continuityRules]
      properties:
        style: { type: string, minLength: 1, maxLength: 2000 }
        characters:
          type: array
          maxItems: 20
          items:
            type: object
            additionalProperties: false
            required: [id, description]
            properties:
              id: { type: string, pattern: '^[A-Za-z0-9_-]+$' }
              description: { type: string, minLength: 1, maxLength: 2000 }
        environment: { type: string, minLength: 1, maxLength: 3000 }
        continuityRules:
          type: array
          maxItems: 50
          items: { type: string, minLength: 1, maxLength: 1000 }
    ProjectSceneInput:
      type: object
      additionalProperties: false
      required: [sequence, prompt]
      properties:
        sequence: { type: integer, minimum: 1 }
        prompt: { type: string, minLength: 1, maxLength: 4000 }
        continuityInstructions: { type: string, minLength: 1, maxLength: 1500 }
    StartProjectRequest:
      type: object
      additionalProperties: false
      required: [concept, model, duration, resolution, aspect_ratio, visualBible, scenes]
      properties:
        concept: { type: string, minLength: 1, maxLength: 4000 }
        model: { type: string, enum: [veo-3.1-fast] }
        duration: { type: integer, minimum: 60, maximum: 180 }
        resolution: { type: string, enum: [720p, 1080p] }
        aspect_ratio: { type: string, enum: ['16:9'] }
        visualBible: { $ref: '#/components/schemas/VisualBible' }
        scenes:
          type: array
          minItems: 8
          maxItems: 23
          description: Must contain exactly ceil(duration / 8) scenes, sequentially numbered from 1.
          items: { $ref: '#/components/schemas/ProjectSceneInput' }
    ProjectStateRequest:
      type: object
      additionalProperties: false
      required: [projectState]
      properties:
        projectState:
          type: string
          description: Latest middleware-signed Project State Token. Never reuse an older token after receiving a replacement.
    ProjectResponse:
      type: object
      required: [projectId, status, progress, model, targetDuration, scenes, projectState, downloadUrl, outputExpiresAt, error]
      properties:
        projectId: { type: string, format: uuid }
        status: { type: string, enum: [planning, generating, assembling, completed, failed] }
        progress: { type: integer, minimum: 0, maximum: 100 }
        model: { type: string, const: veo-3.1-fast }
        targetDuration: { type: integer }
        scenes:
          type: object
          required: [total, completed, processing, pending]
          properties:
            total: { type: integer }
            completed: { type: integer }
            processing: { type: integer }
            pending: { type: integer }
        projectState: { type: string }
        downloadUrl:
          anyOf: [{ type: string }, { type: 'null' }]
        outputExpiresAt:
          anyOf: [{ type: string, format: date-time }, { type: 'null' }]
        error:
          anyOf:
            - type: object
              required: [code, message, retryable]
              properties:
                code: { type: string }
                message: { type: string }
                retryable: { type: boolean, const: false }
            - type: 'null'
    GenerateVideoRequest:
      type: object
      additionalProperties: false
      required: [prompt, model]
      properties:
        prompt:
          type: string
          minLength: 1
          maxLength: 10000
        model:
          type: string
          description: Use getVideoModels to select a supported model and compatible parameters.
          enum: [veo-3.1, veo-3.1-fast, veo-2, veo-3.1-lite, omni-flash, grok-3, grok-lower, seedance-2, seedance-2-omni, seedance-2-mini, seedance-2-5-omni, flux-3, minimax-h3, kling-video-3-0, kling-video-2-6, kling-video-o1, kling-video-2-5, kling-video-2-1-10s, kling-video-2-1-5s, kling-video-1-6-10s, kling-video-1-6-5s]
        duration:
          type: integer
          minimum: 3
          maximum: 30
          description: Model-specific. Omit to use the selected model default.
        resolution:
          type: string
          enum: [480p, 720p, 1080p]
          description: Model-specific. Some models derive resolution from mode or do not accept this field.
        aspect_ratio:
          type: string
          description: Model-specific. Use getVideoModels for accepted values.
        mode_image:
          type: string
          enum: [frame, ingredient]
        ref_images:
          type: array
          description: HTTP(S) image URLs, in start/end-frame order when mode_image is frame.
          maxItems: 14
          items:
            type: string
            format: uri
        mode:
          type: string
          description: Optional model-specific quality or generation mode.
        skip_audio:
          type: boolean
          description: Grok-only option. True requests a silent video.
    ExtendVideoRequest:
      type: object
      additionalProperties: false
      required: [prompt, model, source_uuid]
      properties:
        prompt:
          type: string
          minLength: 1
          maxLength: 10000
        model:
          type: string
        source_uuid:
          type: string
          format: uuid
    StoryboardRequest:
      type: object
      additionalProperties: false
      required: [scenes]
      properties:
        model:
          type: string
          enum: [grok-video, grok-3]
          default: grok-video
        scenes:
          type: array
          minItems: 2
          maxItems: 10
          items:
            type: object
            additionalProperties: false
            required: [prompt, duration]
            properties:
              prompt:
                type: string
              duration:
                type: integer
                enum: [6, 10]
        aspect_ratio:
          type: string
          enum: [landscape, portrait, square]
          default: landscape
        resolution:
          type: string
          enum: [480p, 720p]
          default: 480p
    VideoGeneration:
      type: object
      required: [uuid, status, provider, model]
      properties:
        uuid:
          type: string
          format: uuid
        status:
          type: string
          const: processing
        provider:
          type: string
          const: snapgen
        model:
          type: string
    VideoGenerationStatus:
      type: object
      required: [uuid, status, progress, videoUrl, provider]
      properties:
        uuid:
          type: string
          format: uuid
        status:
          type: string
          enum: [processing, completed, failed]
        progress:
          type: integer
          minimum: 0
          maximum: 100
        videoUrl:
          anyOf:
            - type: string
              format: uri
            - type: 'null'
        provider:
          type: string
          const: snapgen
        error:
          type: string
    VideoOperation:
      type: object
      required: [uuid, status, provider, operation, model]
      properties:
        uuid:
          type: string
          format: uuid
        status:
          type: string
          const: processing
        provider:
          type: string
          const: snapgen
        operation:
          type: string
          enum: [extend, storyboard]
        model:
          type: string
    VideoModel:
      type: object
      required: [id, family, supportsTextToVideo, supportsImageToVideo, supportsExtend, resolutions, aspectRatios, durations, modes, maxReferenceImages]
      properties:
        id:
          type: string
        family:
          type: string
        supportsTextToVideo:
          type: boolean
        supportsImageToVideo:
          type: boolean
        supportsExtend:
          type: boolean
        resolutions:
          type: array
          items: { type: string }
        aspectRatios:
          type: array
          items: { type: string }
        durations: {}
        modes:
          type: array
          items: { type: string }
        maxReferenceImages:
          type: integer
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
        status:
          type: integer
        details: {}
  responses:
    Unauthorized:
      description: Missing or invalid middleware API key
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: Unauthorized
    ValidationError:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    SnapGenError:
      description: Error returned while calling SnapGen
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
